name: application-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm --prefix gateway ci
      - run: npm --prefix gateway test
      - run: npm audit
      - run: npm --prefix gateway audit
      # Discover directly to avoid the hosted Python standard-library test package.
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: python scripts/verify_repository.py
